name: verify-sudo-rs
on:
  push:
    branches: [verify/sudo-rs-preserve-env]
  workflow_dispatch:
jobs:
  verify:
    name: ${{ matrix.opctl }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        opctl: [release-v0.1.76, this-branch]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.opctl == 'this-branch'
        with:
          go-version-file: go.mod
      - name: Install opctl (${{ matrix.opctl }})
        run: |
          if [ "${{ matrix.opctl }}" = this-branch ]; then
            # same inputs the repo's compile op generates; the webapp UI isn't needed here
            mkdir -p webapp/build && echo placeholder > webapp/build/index.html
            dst=sdks/go/node/containerruntime/embedded/embeds/linux-amd64
            mkdir -p "$dst" lima
            curl -fsSL https://github.com/lima-vm/lima/releases/download/v1.2.1/lima-1.2.1-Linux-x86_64.tar.gz | tar -xz -C lima
            gunzip lima/share/lima/lima-guestagent.Linux-x86_64.gz
            mv lima/share/lima/lima-guestagent.Linux-x86_64 lima/bin/limactl "$dst"
            CGO_ENABLED=0 go build -buildvcs=false -tags=containers_image_openpgp -o opctl ./cli
            sudo install opctl /usr/local/bin/opctl
          else
            curl -fsSL https://github.com/opctl/opctl/releases/download/v0.1.76/opctl-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin
          fi
          sudo --version | head -1
          id
      - name: Run op with input supplied only via env (non-root, so opctl re-execs via sudo)
        env:
          probe: from-env
        run: |
          set +e
          # redirect to a file, not a pipe: the daemonized node inherits stdout and would keep a pipe open
          timeout 600 opctl run ./verify/env-input > out.log 2>&1 < /dev/null
          rc=$?
          cat out.log
          echo "exit code: $rc"
          echo "rc=$rc" >> "$GITHUB_ENV"
      - name: Assert expected outcome
        run: |
          if [ "${{ matrix.opctl }}" = release-v0.1.76 ] && [ "${{ matrix.os }}" = ubuntu-26.04 ]; then
            echo "expect baseline failure on sudo-rs"
            [ "$rc" != 0 ] && grep -q "failed to get input 'probe'" out.log && grep -q "'-E' is ignored" out.log
          else
            echo "expect success"
            [ "$rc" = 0 ] && grep -q "probe=from-env" out.log && ! grep -q "'-E' is ignored" out.log
          fi
