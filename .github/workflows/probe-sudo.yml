name: probe-sudo
on: [push, workflow_dispatch]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sudo --version | head -1
          export FN_VAR='() { echo hi; }' PAREN_VAR='()x' PLAIN_VAR='ok'
          for k in FN_VAR PAREN_VAR PLAIN_VAR; do
            echo "$k: E=[$(sudo -E printenv $k 2>/dev/null)] list=[$(sudo --preserve-env=$k printenv $k 2>&1)]"
          done
          f() { echo hi; }; export -f f
          echo "exported bash fn: E=[$(sudo -E printenv 'BASH_FUNC_f%%' 2>/dev/null)] list=[$(sudo --preserve-env='BASH_FUNC_f%%' printenv 'BASH_FUNC_f%%' 2>&1)]"
          getconf ARG_MAX; echo "names length: $(compgen -e | paste -sd, - | wc -c)"
